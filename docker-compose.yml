# docker-compose.yml — BackupSys API local self-hosting
#
# Usage:
#   1. Copy .env.example to .env and fill in your secrets.
#   2. docker compose up -d
#   3. Open http://localhost:5000/health to verify.
#   4. Open http://localhost:5000/dashboard to access the dashboard
#      (login with the password you set in BACKUPSYS_DASHBOARD_PASSWORD).
#
# Stopping:
#   docker compose down          # keep data volume
#   docker compose down -v       # also delete the data volume

version: "3.9"

services:
  api:
    build: .
    image: backupsys-api:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"   # bind to localhost only; put nginx/Caddy in front for TLS
    volumes:
      - backupsys_data:/data
    env_file:
      - .env                     # loads BACKUPSYS_API_KEY, BACKUPSYS_DASHBOARD_PASSWORD, etc.
    environment:
      # These can also be set in .env — values here take precedence.
      PORT: "5000"
      BACKUPSYS_DB_PATH: /data/backupsys.db
      BACKUPSYS_FILES_DIR: /data/files
      LOG_LEVEL: INFO
      # REQUIRED for secure dashboard sessions — set in .env:
      # BACKUPSYS_SESSION_SECRET: <random 32+ char secret>
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  backupsys_data:
    driver: local