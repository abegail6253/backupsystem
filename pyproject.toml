[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "backupsys"
version = "1.1.8"
description = "Windows desktop backup system with PyQt6 tray app, incremental backups, AES-256-GCM encryption, compression, and multi-destination support (local, SFTP, FTP/FTPS, SMB/CIFS, HTTPS API, WebDAV/Nextcloud/ownCloud, Google Drive, rclone)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

dependencies = [
    "cryptography>=42.0",
    "requests>=2.31",
    "paramiko>=3.4",
    "smbprotocol>=1.13",
]

[project.optional-dependencies]
desktop = [
    "PyQt6>=6.6",
    "google-auth>=2.28,<3.0",
    "google-auth-oauthlib>=1.2,<2.0",
    "google-api-python-client>=2.120,<3.0",
    # The five entries below mirror requirements_desktop.txt.
    # Without them, `pip install backupsys[desktop]` silently omits these
    # packages and the app fails at runtime with confusing ImportErrors.
    "watchdog>=3.0.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "keyring>=24.0.0",
    "webdavclient3>=3.14.6",
    # Windows-only: enables VSS (open-file backup) and file-owner tracking.
    # pip ignores this on Linux/macOS automatically via the platform marker.
    "pywin32>=306; sys_platform == 'win32'",
]
api = [
    "flask>=3.0.3,<4.0",
    "flask-cors>=4.0.0,<5.0",
    "gunicorn>=21.2.0,<24.0",
    "werkzeug>=3.0.3,<4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
backupsys = "backupsys_cli:main"

[project.urls]
Homepage = "https://github.com/abegail6253/backupsystem"
Changelog = "https://github.com/abegail6253/backupsystem/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/abegail6253/backupsystem/issues"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"